[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsentinel-backend"
version = "0.1.0"
description = "CloudSentinel AI — Automated Cloud Security Posture Management & Graph Attack Path Analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Harshith", email = "harshith@cloudsentinel.ai" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "bcrypt>=4.0.1",
    "pyjwt>=2.8.0",
    "boto3>=1.34.0",
    "networkx>=3.3",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pandas>=2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "venv", ".venv", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
    "ignore:.*'crypt' is deprecated and slated for removal.*:DeprecationWarning",
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
