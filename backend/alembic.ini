# Alembic configuration for CloudSentinel AI.
#
# The database URL is intentionally NOT set here: env.py resolves it
# from app.core.config.settings (DATABASE_SYNC_URL), so credentials
# stay in environment configuration, not in the repository.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Template used for autogenerated revision files.
file_template = %%(rev)s_%%(slug)s

# Timezone for the 'created at' comment in revision files.
# Use UTC for reproducibility across machines.
timezone = UTC

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = .venv/bin/ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
